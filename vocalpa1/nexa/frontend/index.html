<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa - AI Voice Assistant</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Nexa - Your Personal AI Voice Assistant">
    <meta name="theme-color" content="#6366F1">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">
                <i class="material-icons">smart_toy</i>
            </div>
            <h2>Nexa</h2>
            <p>Initializing your AI voice assistant...</p>
            <div class="loading-spinner"></div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="app-container hidden">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <i class="material-icons">smart_toy</i>
                    Nexa
                </h1>
                <div class="header-actions">
                    <button id="connection-status" class="connection-status" title="Backend Connection">
                        <i class="material-icons">cloud_off</i>
                    </button>
                    <button id="theme-toggle" class="icon-button" title="Toggle Theme">
                        <i class="material-icons">dark_mode</i>
                    </button>
                    <button id="settings-btn" class="icon-button" title="Settings">
                        <i class="material-icons">settings</i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Welcome Message -->
            <div id="welcome-message" class="welcome-message">
                <div class="message-content">
                    <p id="status-text">Hi! Say "Hey Nexa" or tap the microphone...</p>
                </div>
            </div>

            <!-- Central Microphone Section -->
            <div class="microphone-section">
                <!-- Sound Waves Background -->
                <div id="sound-waves" class="sound-waves hidden">
                    <div class="wave wave-1"></div>
                    <div class="wave wave-2"></div>
                    <div class="wave wave-3"></div>
                    <div class="wave wave-4"></div>
                    <div class="wave wave-5"></div>
                </div>

                <!-- Floating Particles -->
                <div id="particles" class="particles hidden"></div>

                <!-- Central Microphone Button -->
                <button id="mic-button" class="mic-button">
                    <div class="mic-glow"></div>
                    <i class="material-icons mic-icon">mic</i>
                    <div class="status-indicator"></div>
                </button>

                <!-- Voice Visualization -->
                <canvas id="voice-canvas" class="voice-canvas hidden"></canvas>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="quick-action" data-action="music">
                    <i class="material-icons">music_note</i>
                    <span>Music</span>
                </button>
                <button class="quick-action" data-action="weather">
                    <i class="material-icons">cloud</i>
                    <span>Weather</span>
                </button>
                <button class="quick-action" data-action="news">
                    <i class="material-icons">article</i>
                    <span>News</span>
                </button>
                <button class="quick-action" data-action="time">
                    <i class="material-icons">schedule</i>
                    <span>Time</span>
                </button>
                <button class="quick-action" data-action="calculator">
                    <i class="material-icons">calculate</i>
                    <span>Math</span>
                </button>
                <button class="quick-action" data-action="apps">
                    <i class="material-icons">apps</i>
                    <span>Apps</span>
                </button>
            </div>

            <!-- Conversation History -->
            <div id="conversation-history" class="conversation-history hidden">
                <div class="conversation-header">
                    <h3>Conversation</h3>
                    <button id="clear-history" class="icon-button">
                        <i class="material-icons">clear_all</i>
                    </button>
                </div>
                <div id="conversation-messages" class="conversation-messages">
                    <!-- Messages will be added dynamically -->
                </div>
            </div>
        </main>

        <!-- Settings Panel -->
        <div id="settings-panel" class="settings-panel hidden">
            <div class="settings-content">
                <div class="settings-header">
                    <h2>Settings</h2>
                    <button id="close-settings" class="icon-button">
                        <i class="material-icons">close</i>
                    </button>
                </div>

                <div class="settings-body">
                    <!-- Voice Settings -->
                    <div class="settings-section">
                        <h3>Voice Settings</h3>
                        
                        <div class="setting-item">
                            <label for="wake-word-toggle">Wake Word Detection</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="wake-word-toggle" checked>
                                <span class="slider"></span>
                            </div>
                        </div>

                        <div class="setting-item">
                            <label for="continuous-listening">Continuous Listening</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="continuous-listening">
                                <span class="slider"></span>
                            </div>
                        </div>

                        <div class="setting-item">
                            <label for="voice-feedback">Voice Feedback</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="voice-feedback" checked>
                                <span class="slider"></span>
                            </div>
                        </div>

                        <div class="setting-item">
                            <label for="speech-rate">Speech Rate</label>
                            <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1">
                            <span class="range-value">1.0x</span>
                        </div>
                    </div>

                    <!-- Backend Settings -->
                    <div class="settings-section">
                        <h3>Backend Connection</h3>
                        
                        <div class="setting-item">
                            <label for="backend-url">Backend URL</label>
                            <input type="url" id="backend-url" value="http://localhost:8000" placeholder="http://localhost:8000">
                        </div>

                        <div class="setting-item">
                            <button id="test-connection" class="btn btn-primary">Test Connection</button>
                            <span id="connection-result" class="connection-result"></span>
                        </div>
                    </div>

                    <!-- Appearance -->
                    <div class="settings-section">
                        <h3>Appearance</h3>
                        
                        <div class="setting-item">
                            <label for="theme-select">Theme</label>
                            <select id="theme-select">
                                <option value="auto">Auto</option>
                                <option value="light">Light</option>
                                <option value="dark">Dark</option>
                            </select>
                        </div>

                        <div class="setting-item">
                            <label for="animations-toggle">Animations</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="animations-toggle" checked>
                                <span class="slider"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Privacy -->
                    <div class="settings-section">
                        <h3>Privacy</h3>
                        
                        <div class="setting-item">
                            <label for="save-conversations">Save Conversations</label>
                            <div class="toggle-switch">
                                <input type="checkbox" id="save-conversations" checked>
                                <span class="slider"></span>
                            </div>
                        </div>

                        <div class="setting-item">
                            <button id="clear-all-data" class="btn btn-danger">Clear All Data</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar" class="status-bar">
            <div class="status-content">
                <span id="status-message">Ready</span>
                <div class="status-indicators">
                    <span id="mic-status" class="status-indicator mic-off">
                        <i class="material-icons">mic_off</i>
                    </span>
                    <span id="backend-status" class="status-indicator offline">
                        <i class="material-icons">cloud_off</i>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="error-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Error</h3>
                <button id="close-error" class="icon-button">
                    <i class="material-icons">close</i>
                </button>
            </div>
            <div class="modal-body">
                <p id="error-message">An error occurred</p>
            </div>
            <div class="modal-footer">
                <button id="error-ok" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(error => console.log('SW registration failed'));
            });
        }
    </script>
</body>
</html>
