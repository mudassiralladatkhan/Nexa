[project]
name = "nexa-backend"
version = "0.1.0"
description = "FastAPI backend for the Nexa voice assistant"
authors = [{ name = "Nexa Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.0",
    "sqlmodel>=0.0.16",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

